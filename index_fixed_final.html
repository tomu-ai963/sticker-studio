<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sticker Studio Free</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --primary: #3b82f6;
            --background: #f1f5f9;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --success: #10b981;
        }
        body { margin: 0; background: var(--background); font-family: sans-serif; color: var(--text); overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .app-container { max-width: 480px; margin: 0 auto; padding: 20px; padding-bottom: 200px; }
        .app-header { text-align: center; margin-bottom: 15px; }
        .app-header h1 { font-size: 1.4rem; font-weight: 800; margin: 0; color: var(--text); }
        .app-header span { font-size: 0.8rem; color: var(--primary); font-weight: 600; display: block; margin-top: 2px; }
        
        .studio-container { position: relative; width: 300px; height: 300px; margin: 0 auto; background: var(--surface); border-radius: 16px; overflow: hidden; border: 4px solid #fff; box-shadow: 0 8px 25px rgba(0,0,0,0.1); touch-action: none; }
        .sticker-mask { position: absolute; top: 0; left: 0; width: 300px; height: 300px; z-index: 10; pointer-events: none; }
        .photo-layer { position: absolute; top: 0; left: 0; transform-origin: top left; z-index: 5; pointer-events: auto; cursor: grab; }
        .sticker-label { position: absolute; z-index: 20; font-weight: 900; color: white; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; padding: 5px 10px; white-space: nowrap; user-select: none; pointer-events: auto; cursor: move; border-radius: 4px; text-transform: uppercase; font-family: sans-serif; }
        
        .card { background: var(--surface); padding: 15px; border-radius: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; border: 1px solid var(--border); }
        .card-title { font-size: 0.8rem; font-weight: 800; color: #64748b; margin-bottom: 10px; display: block; text-transform: uppercase; letter-spacing: 0.05em; }
        .control-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .btn-option { padding: 12px 5px; border-radius: 12px; border: 2px solid var(--border); background: #fff; cursor: pointer; font-size: 0.85rem; font-weight: 700; transition: all 0.2s; color: var(--text); }
        .btn-option.active { border-color: var(--primary); background: #eff6ff; color: var(--primary); }
        
        .btn-main { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: calc(100% - 30px); max-width: 450px; background: var(--success); color: #fff; font-size: 1.1rem; padding: 20px; border: none; border-radius: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 20px rgba(16,185,129,0.3); z-index: 100; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-guide { position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%); width: calc(100% - 30px); max-width: 450px; background: #fff; color: var(--primary); font-size: 0.95rem; padding: 14px; border: 2px solid var(--primary); border-radius: 16px; font-weight: 800; cursor: pointer; z-index: 100; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        .premium-card { border: 2px solid #ffd700; background: #fffdf0; }
        .premium-list { margin: 0; padding: 0 0 0 20px; font-size: 0.85rem; color: #854d0e; }
        .premium-list li { margin-bottom: 4px; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: flex-end; backdrop-filter: blur(4px); }
        .modal-sheet { background: #fff; width: 100%; max-height: 85vh; border-radius: 24px 24px 0 0; padding: 24px 20px 40px; overflow-y: auto; box-shadow: 0 -10px 25px rgba(0,0,0,0.1); }
        .store-btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: 12px; font-weight: 800; text-decoration: none; margin-top: 8px; color: #fff; transition: opacity 0.2s; }
        .store-btn-ios { background: #000; }
        .store-btn-android { background: #16a34a; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        function heartPath(cx, cy, size) {
            const s = size / 300;
            return `M ${cx} ${cy + 130 * s} C ${cx} ${cy + 130 * s} ${cx - 130 * s} ${cy + 50 * s} ${cx - 130 * s} ${cy - 40 * s} C ${cx - 130 * s} ${cy - 90 * s} ${cx - 85 * s} ${cy - 120 * s} ${cx - 50 * s} ${cy - 120 * s} C ${cx - 25 * s} ${cy - 120 * s} ${cx - 10 * s} ${cy - 105 * s} ${cx} ${cy - 90 * s} C ${cx + 10 * s} ${cy - 105 * s} ${cx + 25 * s} ${cy - 120 * s} ${cx + 50 * s} ${cy - 120 * s} C ${cx + 85 * s} ${cy - 120 * s} ${cx + 130 * s} ${cy - 90 * s} ${cx + 130 * s} ${cy - 40 * s} C ${cx + 130 * s} ${cy + 50 * s} ${cx} ${cy + 130 * s} ${cx} ${cy + 130 * s} Z`;
        }

        function roundedStarPath(cx, cy, outerR, innerR, points, cornerR) {
            let path = "";
            for (let i = 0; i < points * 2; i++) {
                const r = i % 2 === 0 ? outerR : innerR;
                const a = (Math.PI * i) / points - Math.PI / 2;
                const x = cx + r * Math.cos(a);
                const y = cy + r * Math.sin(a);
                path += (i === 0 ? "M " : "L ") + x + " " + y;
            }
            return path + " Z";
        }

        const App = () => {
            const [shape, setShape] = useState('circle');
            const [text, setText] = useState('STICKER');
            const [previewImage, setPreviewImage] = useState(null);
            const [photoPos, setPhotoPos] = useState({ x: 0, y: 0 });
            const [photoScale, setPhotoScale] = useState(1.0);
            const [textPos, setTextPos] = useState({ x: 80, y: 130 });
            const [textColor, setTextColor] = useState('#ffffff');
            const [showGuide, setShowGuide] = useState(false);

            const canvasRef = useRef(null);
            const labelRef = useRef(null);
            const isDraggingPhoto = useRef(false);
            const isDraggingText = useRef(false);
            const startPos = useRef({ x: 0, y: 0 });

            const handleFile = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        const asp = img.width / img.height;
                        const baseW = asp >= 1 ? 300 : 300 * asp;
                        const baseH = asp >= 1 ? 300 / asp : 300;
                        setPreviewImage(ev.target.result);
                        setPhotoScale(1.0);
                        setPhotoPos({ x: (300 - baseW)/2, y: (300 - baseH)/2 });
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            };

            const download = () => {
                if (!previewImage) return;
                const cvs = canvasRef.current;
                const ctx = cvs.getContext('2d');
                const S = 1000 / 300; 
                cvs.width = 1000;
                cvs.height = 1000;
                ctx.clearRect(0, 0, 1000, 1000);

                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => {
                    ctx.save();
                    // クリップ作成（Manusの定義を1000pxにスケールアップ）
                    if (shape === 'circle') {
                        ctx.beginPath(); ctx.arc(500, 500, 470, 0, Math.PI * 2); ctx.clip();
                    } else if (shape === 'square') {
                        ctx.beginPath(); ctx.roundRect(50, 50, 900, 900, 120); ctx.clip();
                    } else if (shape === 'star') {
                        const pathStr = roundedStarPath(500, 500, 460, 215, 5, 60);
                        const p = new Path2D(pathStr); ctx.clip(p);
                    } else if (shape === 'heart') {
                        const pathStr = heartPath(500, 500, 560);
                        const p = new Path2D(pathStr); ctx.clip(p);
                    }

                    const asp = img.width / img.height;
                    const baseW = asp >= 1 ? 300 : 300 * asp;
                    const baseH = asp >= 1 ? 300 / asp : 300;

                    ctx.drawImage(img, photoPos.x * S, photoPos.y * S, baseW * photoScale * S, baseH * photoScale * S);
                    ctx.restore();

                    // 文字
                    if (text) {
                        ctx.font = "900 85px sans-serif";
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        const tx = (textPos.x + (labelRef.current ? labelRef.current.offsetWidth / 2 : 0)) * S;
                        const ty = (textPos.y + (labelRef.current ? labelRef.current.offsetHeight / 2 : 0)) * S;
                        ctx.strokeStyle = "#000"; ctx.lineWidth = 15;
                        ctx.strokeText(text.toUpperCase(), tx, ty);
                        ctx.fillStyle = textColor; ctx.fillText(text.toUpperCase(), tx, ty);
                    }

                    // クレジット
                    ctx.font = "500 24px sans-serif"; ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.textAlign = "center";
                    ctx.fillText("Powered by Sticker Studio Free", 500, 960);

                    const link = document.createElement('a');
                    link.download = `sticker_${Date.now()}.png`;
                    link.href = cvs.toDataURL("image/png");
                    link.click();
                };
                img.src = previewImage;
            };

            const onTouchStart = (e, type) => {
                const touch = e.touches[0];
                startPos.current = { x: touch.clientX, y: touch.clientY };
                if (type === 'photo') isDraggingPhoto.current = true;
                if (type === 'text') isDraggingText.current = true;
            };

            const onTouchMove = (e) => {
                if (!isDraggingPhoto.current && !isDraggingText.current) return;
                const touch = e.touches[0];
                const dx = touch.clientX - startPos.current.x;
                const dy = touch.clientY - startPos.current.y;
                startPos.current = { x: touch.clientX, y: touch.clientY };
                if (isDraggingPhoto.current) setPhotoPos(p => ({ x: p.x + dx, y: p.y + dy }));
                if (isDraggingText.current) setTextPos(p => ({ x: p.x + dx, y: p.y + dy }));
            };

            return (
                <div className="app-container" onTouchMove={onTouchMove} onTouchEnd={() => { isDraggingPhoto.current = false; isDraggingText.current = false; }}>
                    <header className="app-header">
                        <h1>Sticker Studio</h1>
                        <span>Free Edition</span>
                    </header>

                    <div className="studio-container">
                        <svg className="sticker-mask" viewBox="0 0 300 300">
                            <defs>
                                <mask id="m">
                                    <rect width="300" height="300" fill="white" />
                                    {shape === 'circle' && <circle cx="150" cy="150" r="142" fill="black" />}
                                    {shape === 'square' && <rect x="15" y="15" width="270" height="270" rx="40" fill="black" />}
                                    {shape === 'star' && <path d={roundedStarPath(150, 150, 140, 65, 5, 20)} fill="black" />}
                                    {shape === 'heart' && <path d={heartPath(150, 150, 170)} fill="black" />}
                                </mask>
                            </defs>
                            <rect width="300" height="300" fill="#f1f5f9" mask="url(#m)" />
                        </svg>
                        
                        {previewImage && (
                            <img src={previewImage} className="photo-layer" 
                                style={{ transform: `translate(${photoPos.x}px, ${photoPos.y}px) scale(${photoScale})` }}
                                onTouchStart={(e) => onTouchStart(e, 'photo')} />
                        )}

                        <div ref={labelRef} className="sticker-label"
                            style={{ left: textPos.x, top: textPos.y, color: textColor }}
                            onTouchStart={(e) => onTouchStart(e, 'text')}>
                            {text}
                        </div>
                    </div>

                    <div className="card" style={{ marginTop: '20px' }}>
                        <span className="card-title">1. ステッカーの形</span>
                        <div className="control-grid">
                            {['circle', 'square', 'star', 'heart'].map(s => (
                                <button key={s} className={`btn-option ${shape === s ? 'active' : ''}`} onClick={() => setShape(s)}>
                                    {s === 'circle' ? '丸' : s === 'square' ? '角丸' : s === 'star' ? '星' : '❤️'}
                                </button>
                            ))}
                        </div>
                    </div>

                    <divclassName="card">
                        <span className="card-title">2. 写真の調整</span>
                        <input type="file" accept="image/*" id="fi" style={{ display: 'none' }} onChange={handleFile} />
                        <button className="btn-option" style={{ width: '100%', marginBottom: '15px' }} onClick={() => document.getElementById('fi').click()}>📸 写真を変更・撮影</button>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '15px' }}>
                            <span style={{ fontSize: '0.8rem', fontWeight: 800 }}>ズーム</span>
                            <input type="range" min="0.1" max="3.0" step="0.01" value={photoScale} onChange={e => setPhotoScale(parseFloat(e.target.value))} style={{ flex: 1 }} />
                        </div>
                    </div>

                    <div className="card">
                        <span className="card-title">3. 文字のカスタマイズ</span>
                        <input type="text" value={text} onChange={e => setText(e.target.value)} style={{ width: '100%', padding: '12px', borderRadius: '12px', border: '2px solid var(--border)', fontSize: '1rem', fontWeight: 700, marginBottom: '12px', boxSizing: 'border-box' }} />
                        <div style={{ display: 'flex', justifyContent: 'center', gap: '12px' }}>
                            {['#ffffff', '#000000', '#ff0000', '#ffff00', '#00ff00', '#00ffff'].map(c => (
                                <div key={c} onClick={() => setTextColor(c)} style={{ width: '32px', height: '32px', borderRadius: '50%', background: c, border: textColor === c ? '3px solid var(--primary)' : '2px solid #fff', boxShadow: '0 2px 5px rgba(0,0,0,0.1)' }} />
                            ))}
                        </div>
                    </div>

                    <div className="card premium-card">
                        <span className="card-title" style={{ color: '#b8860b' }}>💎 プレミアムプラン（買い切り）</span>
                        <p style={{ fontSize: '0.9rem', fontWeight: 800, margin: '4px 0 8px' }}>500円（税込）・追加料金なし</p>
                        <ul className="premium-list">
                            <li>✅ <b>超高画質保存</b></li>
                            <li>✅ <b>ロゴ非表示</b></li>
                            <li>✅ <b>限定フレーム</b></li>
                        </ul>
                        <button className="btn-option" style={{ width: '100%', marginTop: '10px', background: '#ffd700', fontWeight: 800 }} onClick={() => alert('審査中です。')}>💳 プレミアムにアップグレード</button>
                    </div>

                    <button className="btn-guide" onClick={() => setShowGuide(true)}>🖨️ ステッカーを作る方法</button>
                    <button className="btn-main" onClick={download}>💾 背景透過PNGを保存</button>

                    {showGuide && (
                        <div className="modal-overlay" onClick={() => setShowGuide(false)}>
                            <div className="modal-sheet" onClick={e => e.stopPropagation()}>
                                <h3 style={{ margin: '0 0 15px' }}>印刷の手順</h3>
                                <p style={{ fontSize: '0.9rem', color: '#64748b' }}>保存した画像を以下のアプリで読み込むと、コンビニでシールとして印刷できます。</p>
                                <a className="store-btn store-btn-ios" href="#">🍎 App Store (かんたんしーる)</a>
                                <a className="store-btn store-btn-android" href="#">🤖 Google Play (コンビニシール)</a>
                                <button className="btn-option" style={{ width: '100%', marginTop: '20px' }} onClick={() => setShowGuide(false)}>閉じる</button>
                            </div>
                        </div>
                    )}
                    <canvas ref={canvasRef} style={{ display: 'none' }} />
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
